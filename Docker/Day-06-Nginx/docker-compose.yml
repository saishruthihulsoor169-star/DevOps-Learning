version: "3.9"

services:

  app:
    build: .
    container_name: fastapi-app

  nginx:
    image: nginx:latest
    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

  database:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stockdb

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: